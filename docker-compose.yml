version: '3.8'

services:

  # Service PostgreSQL
  postgres:
    image: postgres:16
    container_name: postgres-hotel
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Service Spring Boot
  app:
    image: hotel-booking:1.0
    container_name: hotel-booking-app
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hotel_db
      DB_USERNAME: hotel_user
      DB_PASSWORD: pass
      JWT_SECRET: uneClefSecreteTresLongueEtCompliqueeQuiFait256BitsMinimumPourJWT123456789
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"

volumes:
  postgres-data: